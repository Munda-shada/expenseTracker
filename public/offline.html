<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <title>Expense Tracker Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(360px, calc(100vw - 32px));
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #fff;
        padding: 24px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        margin-top: 18px;
        border-radius: 14px;
        background: #4f46e5;
        color: #fff;
        padding: 12px 16px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }
        main {
          border-color: #334155;
          background: #111827;
        }
        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The app keeps working when it is already cached. Reopen Expense Tracker from your home screen to log locally and sync later.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
